name: quality-gate
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@9fd5edfc8bba9f7408b867e3f58b5a2119358898 # 1.87.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Native Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libx11-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pipeline-check
          key: pipeline-check-${{ hashFiles('pipeline-check.version') }}
      - run: tools/pipeline-check.sh --mode ci
      - name: Browser portable build
        run: cargo build --locked --release --target wasm32-unknown-unknown -p sq-web
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pipeline-report
          path: build/pipeline-check/report.json
          retention-days: 14
  windows:
    # The same code must build and pass its tests on a real Windows machine (requirement SQ-36).
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@9fd5edfc8bba9f7408b867e3f58b5a2119358898 # 1.87.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --locked --workspace --all-targets
      - run: cargo test --locked --workspace
      # The one-file Windows installer: the release program is built first and embedded.
      - run: cargo build --locked --release -p status-quo
      - name: Build status-quo-setup.exe with the program inside
        run: cargo build --locked --release -p status-quo-setup
        env:
          STATUS_QUO_PAYLOAD: ${{ github.workspace }}\target\release\status-quo.exe
      - name: Smoke test the installer and the compatibility check
        run: |
          target\release\status-quo-setup.exe --dry-run
          target\release\status-quo.exe doctor
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: status-quo-setup-windows
          path: target/release/status-quo-setup.exe
          retention-days: 30
