name: release
# Publishes the plug-and-play downloads (Linux packages and the one-file Windows installer,
# SQ-45) when a version tag such as v0.1.0 is pushed. Nothing is published before the real
# install tests of packages.yml pass, and after publishing, the install lines of the README
# are run once more against the published release itself, on bare systems (SQ-47).
on:
  push:
    tags: ["v*"]
  # The automatic dependency update (SQ-53) starts the release of the tag it pushed by name,
  # because a tag pushed with the workflow's own key starts no workflow.
  workflow_dispatch:
jobs:
  packages:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/packages.yml
  publish:
    needs: packages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "*-package*"
          merge-multiple: true
          path: assets
      - name: Create the release with every download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l assets
          (cd assets && sha256sum -c ./*.sha256)
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "Status Quo $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" --clobber \
            assets/status-quo-linux-x86_64.tar.gz assets/status-quo-linux-x86_64.tar.gz.sha256 \
            assets/status-quo-linux-aarch64.tar.gz assets/status-quo-linux-aarch64.tar.gz.sha256 \
            assets/status-quo-setup.exe assets/status-quo-setup.exe.sha256
  published-linux:
    # The published command, from the published addresses, on bare systems.
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "debian:12", "fedora:latest", "archlinux:latest", "opensuse/tumbleweed:latest"]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          mkdir -p out
          docker run --rm -v "$PWD/tools/install-test:/t:ro" -v "$PWD/out:/out" "${{ matrix.image }}" \
            sh /t/linux-bare.sh "$(sh tools/install-test/readme-command.sh linux)" /out
  published-windows:
    needs: publish
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - shell: pwsh
        run: |
          $command = (sh tools/install-test/readme-command.sh windows).Trim()
          foreach ($shell in 'powershell', 'pwsh') {
            & $shell -NoProfile -ExecutionPolicy Bypass -File tools/install-test/windows.ps1 -Line $command -Shell $shell
            if ($LASTEXITCODE -ne 0) { throw "the published command failed in $shell" }
          }
  announce:
    # Installed trays update themselves to a release (SQ-54) only after its published downloads
    # passed the install tests above: the version file they read is published last.
    needs: [published-linux, published-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          printf '%s\n' "$GITHUB_REF_NAME" >version.txt
          gh release upload "$GITHUB_REF_NAME" --clobber version.txt
  previous:
    # The release before this one, which must update itself to this one (SQ-54). Releases
    # before v0.1.6 have no self-update, so for v0.1.6 itself there is nothing to update from.
    needs: announce
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.find.outputs.tag }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=$({ gh release list --exclude-drafts --exclude-pre-releases --limit 50 --json tagName -q '.[].tagName'; echo "$GITHUB_REF_NAME"; } |
            sort -Vu | awk -v me="$GITHUB_REF_NAME" '$0 == me { print previous; exit } { previous = $0 }')
          if [ "$(printf '%s\nv0.1.6\n' "$tag" | sort -V | head -n1)" != v0.1.6 ]; then
            echo "::notice::$tag has no self-update (it came with v0.1.6), so no update test for $GITHUB_REF_NAME"
            tag=""
          fi
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
  published-update-linux:
    needs: previous
    if: needs.previous.outputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: In a bare container, the panel as a background program
        run: |
          docker run --rm -v "$PWD/tools/install-test:/t:ro" ubuntu:24.04 \
            sh /t/linux-update.sh "$(sh tools/install-test/readme-command.sh linux)" "${{ needs.previous.outputs.tag }}" "$GITHUB_REF_NAME"
      - name: As an ordinary user, the panel as a systemd user service
        run: sh tools/install-test/linux-update.sh "$(sh tools/install-test/readme-command.sh linux)" "${{ needs.previous.outputs.tag }}" "$GITHUB_REF_NAME"
  published-update-windows:
    needs: previous
    if: needs.previous.outputs.tag != ''
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - shell: pwsh
        run: |
          $command = (sh tools/install-test/readme-command.sh windows).Trim()
          & powershell -NoProfile -ExecutionPolicy Bypass -File tools/install-test/windows-update.ps1 -Line $command -From '${{ needs.previous.outputs.tag }}' -To $env:GITHUB_REF_NAME
          if ($LASTEXITCODE -ne 0) { throw 'the self-update test failed' }
