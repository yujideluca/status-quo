name: release
# Publishes the one-file Windows installer when a version tag such as v0.1.0 is pushed.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@9fd5edfc8bba9f7408b867e3f58b5a2119358898 # 1.87.0
      # Release builds only read the cache: a poisoned cache entry cannot be written from here.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
      - run: cargo build --locked --release -p status-quo
      - run: cargo build --locked --release -p status-quo-setup
        env:
          STATUS_QUO_PAYLOAD: ${{ github.workspace }}\target\release\status-quo.exe
      - name: Attach status-quo-setup.exe to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" target/release/status-quo-setup.exe \
            --title "Status Quo $GITHUB_REF_NAME" --generate-notes
