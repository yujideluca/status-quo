name: update-dependencies
# Keeps Status Quo current by itself (SQ-53). Once a week: the newest stable Rust, library
# versions, shared quality check and build images (tools/update_dependencies.sh). The commit
# goes to a short-lived branch, the full CI (quality-gate, with the real install tests) runs on
# exactly that commit, and only when every job passed is the same commit put on main and, when
# the program changed, published as a release; installed trays then update themselves (SQ-54).
# A failure, or a library update that needs code changes, is reported in a GitHub issue.
# Commits, tags and pushes made with the workflow's own key start no workflow, so CI and the
# release are started by name (workflow_dispatch), which that key may do.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
concurrency:
  group: update-dependencies
permissions:
  contents: write
  actions: write
  issues: write
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
      - name: Native Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libx11-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - name: Newest versions
        id: newest
        run: |
          tools/update_dependencies.sh build/deps
          cat build/deps/summary.md >>"$GITHUB_STEP_SUMMARY"
          echo "release=$(cat build/deps/release)" >>"$GITHUB_OUTPUT"
          if git diff --quiet; then echo "changed=no" >>"$GITHUB_OUTPUT"; else echo "changed=yes" >>"$GITHUB_OUTPUT"; fi
      - name: Library versions that need code changes
        if: always()
        run: |
          [ -s build/deps/held-back.txt ] || exit 0
          title="Library updates that need code changes"
          body=$(printf 'tools/update_dependencies.sh found newer major versions that the version ranges in Cargo.toml do not allow (or that need a newer Rust than rust-version). Run %s:\n\n```\n%s\n```\n' \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" "$(cat build/deps/held-back.txt)")
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number -q '.[0].number')
          if [ -n "$number" ]; then gh issue edit "$number" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
      - name: Commit to a short-lived branch
        if: steps.newest.outputs.changed == 'yes'
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- rust-toolchain.toml Cargo.toml Cargo.lock pipeline-check.version tools/build-images
          { echo "Automatic dependency update (SQ-53)"; echo; cat build/deps/summary.md; } | git commit -q -F -
          branch="deps-$(git rev-parse --short HEAD)"
          git push -q origin "HEAD:refs/heads/$branch"
          echo "branch=$branch" >>"$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
      - name: Full CI on exactly that commit
        if: steps.newest.outputs.changed == 'yes'
        id: ci
        run: |
          gh workflow run quality-gate.yml --ref "${{ steps.commit.outputs.branch }}"
          run=""
          for _ in $(seq 60); do
            run=$(gh run list --workflow quality-gate.yml --branch "${{ steps.commit.outputs.branch }}" --json databaseId,headSha \
              -q "map(select(.headSha == \"${{ steps.commit.outputs.sha }}\")) | .[0].databaseId")
            [ -n "$run" ] && break
            sleep 10
          done
          [ -n "$run" ] || { echo "the CI run did not start"; exit 1; }
          echo "run=$run" >>"$GITHUB_OUTPUT"
          gh run watch "$run" --interval 60 --exit-status >/dev/null
      - name: Put the tested commit on main
        if: steps.newest.outputs.changed == 'yes'
        run: git push origin "${{ steps.commit.outputs.sha }}:refs/heads/main"
      - name: Publish the release
        if: steps.newest.outputs.changed == 'yes' && steps.newest.outputs.release == 'yes'
        run: |
          tag="v$(sed -n '/^\[workspace.package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          git tag "$tag" "${{ steps.commit.outputs.sha }}"
          git push origin "refs/tags/$tag"
          gh workflow run release.yml --ref "$tag"
      - name: Remove the short-lived branch
        if: always() && steps.commit.outputs.branch != ''
        run: git push -q origin --delete "${{ steps.commit.outputs.branch }}" || true
      - name: Report a failure
        if: failure()
        run: |
          title="Automatic dependency update failed"
          body="Run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID failed; nothing was put on main or published. CI run: ${{ steps.ci.outputs.run || 'none' }}."
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number -q '.[0].number')
          if [ -n "$number" ]; then gh issue comment "$number" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
