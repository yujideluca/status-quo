[workspace]
members = ["crates/core", "crates/contract", "crates/widgets", "crates/store", "crates/sources", "crates/collector", "crates/tray", "crates/desktop", "crates/web"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sq-core = { path = "crates/core" }
sq-contract = { path = "crates/contract" }
sq-widgets = { path = "crates/widgets" }

[profile.release]
lto = "thin"
strip = true
