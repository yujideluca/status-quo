[package]
name = "status-quo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
[dependencies]
sq-core.workspace = true
sq-contract.workspace = true
sq-widgets.workspace = true
sq-tray = { path = "../tray" }
sq-collector = { path = "../collector" }
sq-store = { path = "../store" }
sq-sources = { path = "../sources" }
serde_json.workspace = true
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow"] }
image = { version = "0.25", default-features = false, features = ["png"] }
raw-window-handle = "0.6"
fs2 = "0.4"
sha2 = "0.10"

ctrlc = { version = "3", features = ["termination"] }

# Linux only: the X11 and Wayland hosts. Windows uses the ordinary window of eframe.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
x11rb = { version = "0.13", features = ["randr"] }
winit = { version = "0.30", default-features = false, features = ["x11", "wayland"] }
smithay-client-toolkit = { version = "0.19.2", default-features = false, features = ["calloop"] }
wgpu = { version = "24", default-features = false, features = ["wgsl"] }
egui-wgpu = { version = "0.31.1", default-features = false }
pollster = "0.4"

# Windows: OpenGL first, DirectX through wgpu when the machine has no OpenGL 2 (virtual machines,
# remote sessions, old drivers).
[target.'cfg(windows)'.dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "wgpu"] }
