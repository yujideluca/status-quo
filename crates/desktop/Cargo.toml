[package]
name = "status-quo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
[dependencies]
sq-core.workspace = true
sq-contract.workspace = true
sq-widgets.workspace = true
sq-tray = { path = "../tray" }
sq-collector = { path = "../collector" }
sq-store = { path = "../store" }
sq-sources = { path = "../sources" }
serde_json.workspace = true
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow"] }
image = { version = "0.25", default-features = false, features = ["png"] }
raw-window-handle = "0.6"
fs2 = "0.4"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

ctrlc = { version = "3", features = ["termination"] }

# Linux only: the X11 and Wayland hosts. Windows uses the ordinary window of eframe.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
x11rb = { version = "0.13", features = ["randr"] }
winit = { version = "0.30", default-features = false, features = ["x11", "wayland"] }
smithay-client-toolkit = { version = "0.19.2", default-features = false, features = ["calloop"] }
# Vulkan and OpenGL ES must be named since wgpu 25; without them the layer-shell panel has no
# way to draw (0.1.5 stopped at start on KDE Plasma, sway and Hyprland).
wgpu = { version = "27", default-features = false, features = ["wgsl", "vulkan", "gles"] }
egui-wgpu = { version = "0.33.3", default-features = false }
pollster = "0.4"
# Already part of the build (the window libraries load X11, Wayland and OpenGL with it); used
# directly by `doctor` to ask whether those system libraries are present.
libloading = "0.8"

# Windows: OpenGL first, DirectX through wgpu when the machine has no OpenGL 2 (virtual machines,
# remote sessions, old drivers).
[target.'cfg(windows)'.dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "wgpu"] }
# The DirectX 12 backend must be named: without it the DirectX fallback finds no graphics
# adapter at all (v0.1.0 to v0.1.2), and a PC without a graphics driver shows no panel.
wgpu = { version = "27", default-features = false, features = ["dx12", "wgsl"] }
